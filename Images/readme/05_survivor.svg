ily="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#5ee05a" text-anchor="start" >Neo.Abilities: author data, run one validated pipeline</text><rect x="40" y="100" width="220" height="116" rx="14" fill="#171f3b" stroke="#a07bff" stroke-width="1.5" /><text x="150.0" y="128" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#eef2ff" text-anchor="middle" >AbilityDefinition</text><text x="150.0" y="148" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#eef2ff" text-anchor="middle" >ModifierDefinition</text><text x="150.0" y="168" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#eef2ff" text-anchor="middle" >UnitTemplate</text><text x="150.0" y="190" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#9aa6cf" text-anchor="middle" >data assets</text><rect x="290" y="100" width="220" height="116" rx="14" fill="#171f3b" stroke="#5ee05a" stroke-width="1.5" /><text x="400.0" y="128" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#eef2ff" text-anchor="middle" >Cast pipeline</text><text x="400.0" y="156" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#9aa6cf" text-anchor="middle" >one validated path</text><rect x="540" y="100" width="270" height="116" rx="14" fill="#171f3b" stroke="#38d6e8" stroke-width="1.5" /><text x="675.0" y="128" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#eef2ff" text-anchor="middle" >Effects and states</text><text x="675.0" y="156" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#9aa6cf" text-anchor="middle" >damage, heal, knockback,</text><text x="675.0" y="173" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#9aa6cf" text-anchor="middle" >pull, teleport, chain,</text><text x="675.0" y="190" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#9aa6cf" text-anchor="middle" >execute; buffs, DoT,</text><text x="675.0" y="207" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#9aa6cf" text-anchor="middle" >auras, shields, stuns</text><rect x="840" y="100" width="220" height="116" rx="14" fill="#171f3b" stroke="#ff9548" stroke-width="1.5" /><text x="950.0" y="128" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#eef2ff" text-anchor="middle" >Receipts</text><text x="950.0" y="156" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#9aa6cf" text-anchor="middle" >multiplayer-ready</text><line x1="262" y1="158" x2="288" y2="158" stroke="#9aa6cf" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arr)"/><line x1="512" y1="158" x2="538" y2="158" stroke="#9aa6cf" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arr)"/><line x1="812" y1="158" x2="838" y2="158" stroke="#9aa6cf" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arr)"/><text x="40" y="262" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#38d6e8" text-anchor="start" >SurvivorDemo: a Vampire-Survivors-style game from one asset</text><rect x="40" y="278" width="215" height="96" rx="14" fill="#171f3b" stroke="#a07bff" stroke-width="1.5" /><text x="147.5" y="306" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#eef2ff" text-anchor="middle" >SurvivorConfig</text><text x="147.5" y="326" font-family="