<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="uitk:screen" content="NthChild">
<link rel="stylesheet" href="../../../assets/uitk-base.css" data-uitk-harness>
<style>
.nt { position: absolute; left: 0; top: 0; right: 0; bottom: 0; }
.nt__cell { height: 24px; }
.nt__cell:nth-child(odd) { color: #111111; }
.nt__cell:nth-child(even) { color: #222222; }
.nt__cell:nth-of-type(3) { color: #333333; }
</style>
</head>
<body>
<div name="nt-root" class="nt">
  <div name="nt-1" class="nt__cell"></div>
  <div name="nt-2" class="nt__cell"></div>
  <div name="nt-3" class="nt__cell"></div>
  <div name="nt-4" class="nt__cell"></div>
  <div name="nt-5" class="nt__cell"></div>
  <div name="nt-6" class="nt__cell"></div>
</div>
</body>
</html>
