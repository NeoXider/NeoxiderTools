<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="290" viewBox="0 0 1100 290" role="img" aria-labelledby="t d"><title id="t">Every module has the same shape</title><desc id="d">A tested runtime core, scene wrappers, optional no-code helpers, docs and samples</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#131a33"/></linearGradient><linearGradient id="gGreen" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8cff7a"/><stop offset="1" stop-color="#2fbf4a"/></linearGradient><linearGradient id="gCyan" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7defff"/><stop offset="1" stop-color="#1b9fc0"/></linearGradient><linearGradient id="gPurple" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c3a8ff"/><stop offset="1" stop-color="#6c4be0"/></linearGradient><linearGradient id="gOrange" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffc27a"/><stop offset="1" stop-color="#e8661e"/></linearGradient><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9aa6cf"/></marker><marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5ee05a"/></marker><filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1100" height="290" rx="18" fill="url(#bg)"/><rect x="0.75" y="0.75" width="1098.5" height="288.5" rx="17.5" fill="none" stroke="#2c3868" stroke-width="1.5"/><text x="40" y="46" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#eef2ff" text-anchor="start" >Every module is built the same way</text><rect x="40" y="82" width="232" height="124" rx="14" fill="#171f3b" stroke="#2c3868" stroke-width="1.5" /><rect x="40" y="96" width="5" height="96" rx="2.5" fill="#5ee05a"/><text x="60" y="112" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#eef2ff" text-anchor="start" >1  Runtime core</text><text x="60" y="136" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#9aa6cf" text-anchor="start" >Plain C# where practical</text><text x="60" y="156" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#9aa6cf" text-anchor="start" >Explicit contracts</text><text x="60" y="176" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#9aa6cf" text-anchor="start" >EditMode tests for the public API</text><line x1="276" y1="144" x2="298" y2="144" stroke="#9aa6cf" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arr)"/><rect x="302" y="82" width="232" height="124" rx="14" fill="#171f3b" stroke="#2c3868" stroke-width="1.5" /><rect x="302" y="96" width="5" height="96" rx="2.5" fill="#38d6e8"/><text x="322" y="112" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#eef2ff" text-anchor="start" >2  Scene wrappers</text><text x="322" y="136" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#9aa6cf" text-anchor="start" >MonoBehaviour adapters</text><text x="322" y="156" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#9aa6cf" text-anchor="start" >Dependencies as serialized fields</text><text x="322" y="176" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#9aa6cf" text-anchor="start" >Use only the parts you need</text><line x1="538" y1="144" x2="560" y2="144" stroke="#9aa6cf" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arr)"/><rect x="564" y="82" width="232" height="124" rx="14" fill="#171f3b" stroke="#2c3868" stroke-width="1.5" /><rect x="564" y="96" width="5" height="96" rx="2.5" fill="#a07bff"/><text x="584" y="112" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#eef2ff" text-anchor="start" >3  No-code helpers</text><text x="584" y="136" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#9aa6cf" text-anchor="start" >Optional inspector layer</text><text x="584" y="156" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#9aa6cf" text-anchor="start" >Calls the same typed APIs</text><text x="584" y="176" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#9aa6cf" text-anchor="start" >Never replaces the C# path</text><line x1="800" y1="144" x2="822" y2="144" stroke="#9aa6cf" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arr)"/><rect x="826" y="82" width="232" height="124" rx="14" fill="#171f3b" stroke="#2c3868" stroke-width="1.5" /><rect x="826" y="96" width="5" height="96" rx="2.5" fill="#ff9548"/><text x="846" y="112" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#eef2ff" text-anchor="start" >4  Docs and samples</text><text x="846" y="136" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#9aa6cf" text-anchor="start" >One README per module</text><text x="846" y="156" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#9aa6cf" text-anchor="start" >Demo scenes</text><text x="846" y="176" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#9aa6cf" text-anchor="start" >Reuse map for coding agents</text><rect x="40" y="226" width="1020" height="40" rx="12" fill="#0f1530" stroke="#2c3868" stroke-width="1.5" /><text x="550" y="252" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="500" fill="#eef2ff" text-anchor="middle" >Every important no-code behaviour has an equivalent plain C# path, so complex logic never gets trapped in UnityEvent chains.</text></svg>
