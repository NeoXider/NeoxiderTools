name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-test:
    name: build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: restore
        run: dotnet restore HtmlToUitk.sln

      - name: build
        run: dotnet build HtmlToUitk.sln -c Release --no-restore

      - name: test
        run: >
          dotnet test HtmlToUitk.sln -c Release --no-build
          --logger "trx;LogFileName=test-results-${{ matrix.os }}.trx"
          --results-directory artifacts/test-results

      - name: validate examples
        if: success() || failure()
        run: |
          mkdir -p artifacts/diagnostics
          bash tools/ci-validate.sh "${{ matrix.os }}"

      - name: upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: artifacts/test-results
          if-no-files-found: ignore

      - name: upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-${{ matrix.os }}
          path: artifacts/diagnostics
          if-no-files-found: ignore

  determinism:
    name: cross-platform output hash
    needs: build-test
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: build cli
        run: dotnet build src/HtmlToUitk.Cli -c Release

      - name: convert twice and compare
        run: bash tools/ci-determinism.sh
