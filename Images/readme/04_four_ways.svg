<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="270" viewBox="0 0 1100 270" role="img" aria-labelledby="t d"><title id="t">One package, four ways to build</title><desc id="d">Beginners with no code, professionals with C# APIs, optional multiplayer, and AI-agent development</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#131a33"/></linearGradient><linearGradient id="gGreen" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8cff7a"/><stop offset="1" stop-color="#2fbf4a"/></linearGradient><linearGradient id="gCyan" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7defff"/><stop offset="1" stop-color="#1b9fc0"/></linearGradient><linearGradient id="gPurple" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c3a8ff"/><stop offset="1" stop-color="#6c4be0"/></linearGradient><linearGradient id="gOrange" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffc27a"/><stop offset="1" stop-color="#e8661e"/></linearGradient><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9aa6cf"/></marker><marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5ee05a"/></marker><filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1100" height="270" rx="18" fill="url(#bg)"/><rect x="0.75" y="0.75" width="1098.5" height="268.5" rx="17.5" fill="none" stroke="#2c3868" stroke-width="1.5"/><text x="40" y="46" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#eef2ff" text-anchor="start" >One package, four ways to build</text><rect x="40" y="80" width="237" height="150" rx="14" fill="#171f3b" stroke="#2c3868" stroke-width="1.5" /><rect x="40" y="94" width="5" height="122" rx="2.5" fill="#5ee05a"/><text x="60" y="110" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#eef2ff" text-anchor="start" >No code</text><text x="60" y="134" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#9aa6cf" text-anchor="start" >Wire real gameplay in the</text><text x="60" y="154" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#9aa6cf" text-anchor="start" >Inspector: conditions,</text><text x="60" y="174" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#9aa6cf" text-anchor="start" >counters, timers, shops,</text><text x="60" y="194" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#9aa6cf" text-anchor="start" >wheels and pages.</text><rect x="301" y="80" width="237" height="150" rx="14" fill="#171f3b" stroke="#2c3868" stroke-width="1.5" /><rect x="301" y="94" width="5" height="122" rx="2.5" fill="#38d6e8"/><text x="321" y="110" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#eef2ff" text-anchor="start" >Clean C# APIs</text><text x="321" y="134" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#9aa6cf" text-anchor="start" >Save, Shop, Abilities,</text><text x="321" y="154" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#9aa6cf" text-anchor="start" >StateMachine, Reactive,</text><text x="321" y="174" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#9aa6cf" text-anchor="start" >Pooling: concise APIs and</text><text x="321" y="194" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#9aa6cf" text-anchor="start" >200+ extension methods.</text><rect x="562" y="80" width="237" height="150" rx="14" fill="#171f3b" stroke="#2c3868" stroke-width="1.5" /><rect x="562" y="94" width="5" height="122" rx="2.5" fill="#ff9548"/><text x="582" y="110" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#eef2ff" text-anchor="start" >Multiplayer, optional</text><text x="582" y="134" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#9aa6cf" text-anchor="start" >Mirror bridges and a one-</text><text x="582" y="154" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#9aa6cf" text-anchor="start" >button LAN Quick Play.</text><text x="582" y="174" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#9aa6cf" text-anchor="start" >Every script still runs</text><text x="582" y="194" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#9aa6cf" text-anchor="start" >solo without Mirror.</text><rect x="823" y="80" width="237" height="150" rx="14" fill="#171f3b" stroke="#2c3868" stroke-width="1.5" /><rect x="823" y="94" width="5" height="122" rx="2.5" fill="#a07bff"/><text x="843" y="110" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#eef2ff" text-anchor="start" >Agent-friendly</text><text x="843" y="134" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#9aa6cf" text-anchor="start" >A bundled agent skill,</text><text x="843" y="154" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#9aa6cf" text-anchor="start" >linked docs and a machine-</text><text x="843" y="174" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#9aa6cf" text-anchor="start" >readable reuse map for</text><text x="843" y="194" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#9aa6cf" text-anchor="start" >Claude or Codex.</text></svg>
