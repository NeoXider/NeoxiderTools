<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="uitk:screen" content="Toggle">
<link rel="stylesheet" href="../../../assets/uitk-base.css" data-uitk-harness>
<style>
.cp { position: absolute; left: 0; top: 0; right: 0; bottom: 0; }

.cp__panel {
    height: 80px;
    opacity: 0;
    translate: 0 12px;
    transition: opacity 0.2s ease-out, translate 0.2s ease-out;
}
.cp__panel.is-open { opacity: 1; translate: 0 0; }
</style>
</head>
<body>
<div name="cp-root" class="cp">
  <div name="cp-panel" class="cp__panel"></div>
</div>
</body>
</html>
